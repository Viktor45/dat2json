name: CI

# Workflow triggers
on:
  # push:
  #   branches: [ main ]
  workflow_dispatch: # Manual trigger from GitHub UI
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fast linting and format checks (runs in parallel with tests for optimal CI speed)
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Run gofmt checks
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found issues:" && echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: binary
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

  # Test suite and build verification (isolated for clearer test result reporting)
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    needs: lint # Tests only run if linting passes successfully
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Go module caching for faster dependency resolution
      # Cache key based on go.sum for automatic invalidation on dependency changes
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -race -timeout=10m -coverprofile=coverage.out

      # Optional: upload code coverage metrics for quality tracking
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
